name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            Packages/MumbleKit/.build
            build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/MumbleKit/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Unit tests
        working-directory: Packages/MumbleKit
        # Model integration tests (MUMBLE_INTEGRATION=1) download ~330 MB; they run locally.
        run: swift test --filter MumbleCoreTests

      - name: Build app
        env:
          MUMBLE_BUILD: ${{ github.run_number }}
          MUMBLE_SIGNING_P12_BASE64: ${{ secrets.MUMBLE_SIGNING_P12_BASE64 }}
        run: scripts/build.sh

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Mumble-ci-${{ github.run_number }}
          path: build/Mumble.app
          retention-days: 14
