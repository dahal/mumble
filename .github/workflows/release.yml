name: Release

# Fully automated releases. Every merge to main that changes the app publishes a new version:
#
#   PR title (= squash commit)          version bump
#   fix: … / chore: … / anything else   patch   0.1.1 → 0.1.2
#   feat: …                             minor   0.1.1 → 0.2.0
#   feat!: … or "BREAKING CHANGE"       major   (minor while below 1.0.0)
#
# Merges that only touch docs, design files or CI don't release. Put "[skip release]" in the
# commit message to skip one. You can also release manually: push a tag (git tag v1.2.0 &&
# git push origin v1.2.0; a suffix like v1.3.0-beta.1 makes a pre-release) or run this workflow
# from the Actions tab and choose the bump.
#
# Secrets (all optional):
#   MUMBLE_SIGNING_P12_BASE64      stable self-signed identity (scripts/export-signing-identity.sh)
#   DEVELOPER_ID_P12_BASE64        Apple "Developer ID Application" certificate (.p12, base64)
#   DEVELOPER_ID_P12_PASSWORD      its password
#   NOTARY_KEY_ID                  App Store Connect API key ID          ┐
#   NOTARY_ISSUER_ID               App Store Connect issuer ID           ├ for notarization
#   NOTARY_KEY_BASE64              the .p8 key file, base64              ┘
# Without the Developer ID secrets the release is self-signed and not notarized; the one-line
# installer still works without any extra steps for users.

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Only app changes release. (Path filters don't apply to tag pushes.)
    paths:
      - "Mumble/**"
      - "Packages/MumbleKit/Sources/**"
      - "Packages/MumbleKit/Package.swift"
      - "Packages/MumbleKit/Package.resolved"
      - "project.yml"
      - "scripts/build.sh"
      - "scripts/sign.sh"
      - "scripts/package.sh"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto = from commit messages)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      version:
        description: "Or an exact version, e.g. 1.2.0 or 1.3.0-beta.1 (overrides bump)"
        required: false

permissions:
  contents: write

# Releases run one at a time, in order. A queued run builds main as it is when it starts, so it
# includes any merges that were waiting.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # all tags and history, to compute the next version

      - name: Resolve version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          skip() { echo "Skipping release: $1"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }

          if [[ "$REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ "$EVENT" == "workflow_dispatch" && -n "$INPUT_VERSION" ]]; then
            version="${INPUT_VERSION#v}"
          else
            [[ "$HEAD_MESSAGE" == *"[skip release]"* ]] && skip "commit says [skip release]"
            released=$(git tag --points-at HEAD --list 'v*' | head -1)
            [[ -n "$released" ]] && skip "this commit is already released as $released"
            version=$(scripts/next-version.sh "${INPUT_BUMP:-auto}")
          fi

          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Invalid version: $version"; exit 1; }
          if [[ "$REF_TYPE" != "tag" ]] && git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "Tag v$version already exists"; exit 1
          fi
          echo "Releasing $version"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          [[ "$version" == *-* ]] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"
          # CFBundleShortVersionString must be numeric: strip any pre-release suffix.
          echo "bundle_version=${version%%-*}" >> "$GITHUB_OUTPUT"

      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.version.outputs.skip != 'true'
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        if: steps.version.outputs.skip != 'true'
        run: brew install xcodegen

      - name: Cache Swift packages
        if: steps.version.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            Packages/MumbleKit/.build
            build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/MumbleKit/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Unit tests
        if: steps.version.outputs.skip != 'true'
        working-directory: Packages/MumbleKit
        run: swift test --filter MumbleCoreTests

      - name: Import Developer ID certificate
        if: steps.version.outputs.skip != 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [[ -z "$P12" ]]; then
            echo "No Developer ID secret: the release will be self-signed."
            exit 0
          fi
          keychain="$RUNNER_TEMP/developer-id.keychain-db"
          password=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          [[ -n "$identity" ]] || { echo "No Developer ID Application identity in the certificate"; exit 1; }
          echo "DEVELOPER_ID_IDENTITY=$identity" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/developer-id.p12"

      - name: Build and sign
        if: steps.version.outputs.skip != 'true'
        env:
          MUMBLE_VERSION: ${{ steps.version.outputs.bundle_version }}
          MUMBLE_BUILD: ${{ github.run_number }}
          MUMBLE_SIGNING_P12_BASE64: ${{ secrets.MUMBLE_SIGNING_P12_BASE64 }}
        run: scripts/build.sh

      - name: Package (and notarize when configured)
        if: steps.version.outputs.skip != 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
        run: |
          if [[ -n "$NOTARY_KEY_BASE64" && -n "${DEVELOPER_ID_IDENTITY:-}" ]]; then
            export NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"
            echo "$NOTARY_KEY_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          else
            unset NOTARY_KEY_ID NOTARY_ISSUER_ID
          fi
          scripts/package.sh
          # Release assets carry the full version (including any pre-release suffix).
          bundle="${{ steps.version.outputs.bundle_version }}"
          full="${{ steps.version.outputs.version }}"
          if [[ "$bundle" != "$full" ]]; then
            cd build/dist
            mv "Mumble-$bundle.dmg" "Mumble-$full.dmg"
            mv "Mumble-$bundle.zip" "Mumble-$full.zip"
            shasum -a 256 "Mumble-$full.dmg" "Mumble-$full.zip" Mumble.zip > SHA256SUMS.txt
          fi

      - name: Publish GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source build/package-info
          scripts/release-notes.sh "${{ steps.version.outputs.version }}" "$notarized" "${{ github.repository }}" > "$RUNNER_TEMP/notes.md"
          flags=()
          [[ "${{ steps.version.outputs.prerelease }}" == "true" ]] && flags+=(--prerelease)
          # Creates the tag on this commit (or uses the pushed tag).
          gh release create "${{ steps.version.outputs.tag }}" build/dist/* \
            --title "Mumble ${{ steps.version.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes \
            --target "${{ github.sha }}" "${flags[@]}"
